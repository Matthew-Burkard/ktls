[package]
name = "kotlin-lsp-rust"
version = "0.1.0"
edition = "2024"

[lib]
name = "kotlin_lsp"
path = "src/lib.rs"

[[bin]]
name = "kotlin-lsp"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
crossbeam-channel = "0.5.17"
dirs = "7.0.0"
flate2 = "1.1.10"
log = "0.4.34"
lsp-server = "0.10.0"
lsp-types = "0.97.0"
notify = "8.2.1"
parking_lot = "0.12.5"
rayon = "1.12.0"
rowan = "0.17.0"
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1_smol = "1.0.1"
toml = "1.1.8"
ureq = "3.4.2"
walkdir = "2.5.0"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
debug = "line-tables-only"
